# Resort Cloud — wildcard tenant vhost for nginx.
#
# Terminates TLS with the Cloudflare Origin CA cert (see
# cloudflare-origin-ca.md) and reverse-proxies every tenant subdomain to
# the Odoo instance, with a long-lived cache for static assets and
# websocket support for the Odoo discuss / bus channels.

upstream rcloud-odoo {
    server 127.0.0.1:8069;
}

# Redirect bare apex / www to the control-plane site.
server {
    listen 80;
    server_name resocloud.example.com www.resocloud.example.com;
    return 301 https://app.resocloud.example.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ~^(?<subdomain>.+)\.resocloud\.example\.com$;

    # Cloudflare Origin CA certificate (issued per wildcard, 15y validity).
    ssl_certificate     /etc/nginx/certs/resocloud-origin.pem;
    ssl_certificate_key /etc/nginx/certs/resocloud-origin.key;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:ResoSSL:10m;

    # Cloudflare authenticates tenants; lock the origin to CF IPs only.
    allow 173.245.48.0/20;
    allow 103.21.244.0/22;
    allow 103.22.200.0/22;
    allow 103.31.4.0/22;
    allow 141.101.64.0/18;
    allow 108.162.192.0/18;
    allow 190.93.240.0/20;
    allow 188.114.96.0/20;
    allow 197.234.240.0/22;
    allow 198.41.128.0/17;
    allow 162.158.0.0/15;
    allow 104.16.0.0/13;
    allow 104.24.0.0/14;
    allow 172.64.0.0/13;
    allow 131.0.72.0/22;
    deny all;

    access_log /var/log/nginx/rcloud-tenants-access.log;
    error_log  /var/log/nginx/rcloud-tenants-error.log;

    # Static assets: immutable content, cache hard. Odoo serves these
    # under /web/assets and /web/content with content-hashed URLs.
    location ~* ^/web/(assets|content|image|binary)/ {
        proxy_pass http://rcloud-odoo;
        proxy_cache_valid 200 30d;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
    }

    # Websocket longpolling for the Odoo bus (discuss, notifications).
    location /websocket {
        proxy_pass http://rcloud-odoo;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://rcloud-odoo;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Odoo picks the tenant database from the Host header; make sure
        # the original subdomain survives the proxy chain.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
        client_max_body_size 512m;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
