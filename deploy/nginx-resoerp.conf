# Nginx reverse-proxy example for a resoERP deployment behind aaPanel.
#
# In aaPanel: Website -> Add site for your domain, then in the site's settings
# replace the generated config's server block with the one below (or include
# this file). SSL: use aaPanel's "SSL" tab (Let's Encrypt) after the site works
# on HTTP. Keep ports 8069/8072 closed in the firewall — only 80/443 should be
# public; the Odoo containers only talk to Nginx and each other.

# ---- Public booking website (Angular container) ----
server {
    listen 80;
    server_name your-domain.com www.your-domain.com;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---- Odoo backend (optional: give the staff backend its own subdomain) ----
server {
    listen 80;
    server_name admin.your-domain.com;

    client_max_body_size 25m;

    # Longpolling / websocket traffic must go to 8072 (bus/websocket).
    location /websocket {
        proxy_pass http://127.0.0.1:8072;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /longpolling {
        proxy_pass http://127.0.0.1:8072;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8069;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Odoo is started with proxy_mode = True, which trusts these headers.
    }
}
